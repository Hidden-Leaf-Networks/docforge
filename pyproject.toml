[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docforge"
version = "0.1.0"
description = "Professional document generation with configurable theming — PDF, Word, and multi-format export"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Hidden Leaf Networks"}]

dependencies = [
    "reportlab>=4.0",
]

[project.optional-dependencies]
word = ["python-docx>=1.0"]
excel = ["openpyxl>=3.1"]
all = ["python-docx>=1.0", "openpyxl>=3.1"]
dev = [
    "python-docx>=1.0",
    "openpyxl>=3.1",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.urls]
Homepage = "https://github.com/Hidden-Leaf-Networks/docforge"
Repository = "https://github.com/Hidden-Leaf-Networks/docforge"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
